name: Publish Micro Cases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check self-contained cases
        run: python3 tests/check_case_links.py
      - name: Check highlighted decision questions
        run: python3 tests/check_decision_prompts.py
      - name: Check collection and coverage
        run: python3 tests/check_collection.py
      - name: Check discipline browsing
        run: python3 tests/check_disciplines.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
